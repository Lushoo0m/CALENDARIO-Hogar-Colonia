<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendario de Limpieza · Hogar Colonia</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- App instalable en el celular (PWA): ícono + "Agregar a pantalla de inicio". -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#14151a" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hogar Colonia" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>Calendario de Limpieza — Hogar Colonia</h1>
      <span id="conn-status" class="conn-status">Conectando…</span>
      <nav class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="generar">Generar</button>
        <button class="tab-btn" data-tab="estudiantes">Estudiantes</button>
        <button class="tab-btn" data-tab="semanas">Calendarios anteriores</button>
      </nav>
    </header>

    <main class="app-main">
      <section id="tab-generar" class="tab-panel active"><p class="muted">Cargando…</p></section>
      <section id="tab-estudiantes" class="tab-panel"></section>
      <section id="tab-semanas" class="tab-panel"></section>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="print-area"></div>

  <script src="core.js"></script>
  <script src="ui.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
